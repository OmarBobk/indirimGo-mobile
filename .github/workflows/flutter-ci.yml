name: Flutter CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Verify SDK versions
        run: |
          flutter --version
          test "$(flutter --version --machine | jq -r .frameworkVersion)" = "3.44.8"
          test "$(flutter --version --machine | jq -r .dartSdkVersion)" = "3.12.2"

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify dependency lockfile
        run: git diff --exit-code -- pubspec.lock

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: >-
          flutter build apk --debug
          --dart-define=API_BASE_URL=http://10.0.2.2:8000/api/v1

      - name: Verify effective Android security policy
        run: >-
          apkanalyzer manifest print
          build/app/outputs/flutter-apk/app-debug.apk
          | dart run tool/verify_android_security.dart
          --merged-manifest-stdin
